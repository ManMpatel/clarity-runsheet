services:
  postgres:
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clarity_fleet
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/home/postgres/pgdata/data

  # Present ONLY for the tcp-listener -> ingestion telemetry_queue handoff (LPUSH/BRPOP).
  # Not used for sessions, caching, or job queues anywhere else in the backend.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build: ./backend
    command: npx tsx src/entrypoints/api.ts
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override the image's NODE_ENV=production so local Vite on :5174+ is allowed by CORS.
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clarity_fleet
      REDIS_URL: redis://redis:6379
      TCP_INTERNAL_URL: http://tcp-listener:4001
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - tcp-listener

  tcp-listener:
    build: ./backend
    command: npx tsx src/entrypoints/tcp-listener.ts
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '5027:5027'
      - '4001:4001'
    depends_on:
      - redis

  ingestion:
    build: ./backend
    command: npx tsx src/entrypoints/ingestion.ts
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clarity_fleet
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis

  # Production-style nginx build of the dashboard. Opt-in so it doesn't steal :5173 from Vite
  # during `npm run dev` (which is what forced the hop to :5174 and broke CORS).
  # Start it with: docker compose --profile nginx up
  web:
    profiles: ['nginx']
    build:
      context: ./frontend/web
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SOCKET_URL: http://localhost:3001
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
