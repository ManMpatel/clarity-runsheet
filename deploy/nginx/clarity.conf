# Clarity Fleet — nginx reverse proxy for the single-VPS deployment.
#
# Install:  /etc/nginx/sites-available/clarity.conf  (symlink into sites-enabled)
# Certs:    certbot --nginx -d api.clarity-software.com.au -d socket.clarity-software.com.au
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS DELIBERATELY *NOT* HERE: the device port, 5027.
#
# The FTC921 speaks Teltonika Codec 8/8E over bare TCP — it is not HTTP and has no TLS client.
# Putting it behind this proxy would break it. It stays a raw, publicly-exposed TCP port opened
# directly in ufw and published by docker-compose.prod.yml. That is intentional, not an oversight.
# ─────────────────────────────────────────────────────────────────────────────

# --- API (api.clarity-software.com.au -> 127.0.0.1:3000) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.clarity-software.com.au;
    # certbot rewrites this to a 301 -> https and adds the listen 443 block.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.clarity-software.com.au;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/api.clarity-software.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.clarity-software.com.au/privkey.pem;

    # Report downloads (GET /api/v1/reports/:id/download) stream from the report_storage volume;
    # the default 1m body limit is about uploads, but keep proxy buffering sane for large CSVs.
    client_max_body_size 25m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Socket.io (socket.clarity-software.com.au -> 127.0.0.1:3001) ---
# This is the endpoint DECISIONS.md D-004 wired the mobile client to as
# wss://socket.clarity-software.com.au but never stood up.
server {
    listen 80;
    listen [::]:80;
    server_name socket.clarity-software.com.au;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socket.clarity-software.com.au;

    # ssl_certificate     /etc/letsencrypt/live/socket.clarity-software.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/socket.clarity-software.com.au/privkey.pem;

    # Liveness probe for the ingestion process. Exposed so an external uptime monitor can reach it;
    # it returns queue diagnostics (processed / unknownImei counters), not tenant data.
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;

        # WITHOUT these four lines the WebSocket handshake fails and socket.io silently degrades
        # to HTTP long-polling: live map updates still "work" but with seconds of added latency
        # and far more requests. This is the single most common way this deployment looks fine
        # while being broken.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # socket.io keeps connections open; the 60s default would cut idle sockets and force
        # a reconnect storm from every parked vehicle's dashboard session.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
