# Production override. Use ON TOP of docker-compose.yml, never alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY EVERY `ports:` BELOW CARRIES THE `!override` TAG
#
# Compose merges list fields across files by CONCATENATING them, not replacing. Without the tag,
# the base file's `'5432:5432'` would survive this override and simply gain a second entry — so
# Postgres and Redis would still be listening on 0.0.0.0 on a box with a public IP. `!override`
# replaces the list outright.
#
# This requires Docker Compose v2.24+. Verify the merge actually took effect before exposing the
# box (DEPLOY.md step 8 covers this):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config | grep -A3 published
#
# Every published port below except 5027 is bound to 127.0.0.1 and reached only via nginx
# (deploy/nginx/clarity.conf) or an SSH tunnel. 5027 is deliberately public and raw: GPS hardware
# speaks Codec 8/8E over bare TCP and cannot go through an HTTP reverse proxy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    restart: always
    # ─────────────────────────────────────────────────────────────────────────
    # MEMORY TUNING — capped at ~1 GB, deliberately BELOW what the image picks.
    #
    # timescaledb-ha auto-tunes from *detected host RAM* on first start and writes the result to
    # pgdata/data/postgresql.conf. Measured inside a 4.8 GB Docker VM it chose:
    #
    #   shared_buffers 1.23 GB | work_mem 25.6 MB | maintenance_work_mem 615 MB
    #   max_connections 75 | autovacuum_max_workers 10 | timescaledb.max_background_workers 16
    #
    # On an 8 GB VPS those scale to roughly shared_buffers 2 GB and maintenance_work_mem 1 GB,
    # which is most of the box for a fleet this size. Two of them are worse than they look:
    #
    #   work_mem is per sort/hash NODE per connection, not per connection. A single query with
    #   several sort nodes allocates several multiples of it — and fleet/reports-queue.ts's
    #   fuel-idle report SELECTs telemetry over an arbitrary date range with no LIMIT.
    #
    #   maintenance_work_mem is taken by EACH autovacuum worker and by TimescaleDB's compression
    #   jobs. At the auto-tuned 10 workers x ~1 GB that is a multi-GB exposure on an 8 GB box.
    #
    # Passing these as `-c` flags on the command line OVERRIDES postgresql.conf (verified:
    # pg_settings.source reads 'command line' for every value below), so it works on an existing
    # data volume without editing or mounting a config file. The entrypoint is the stock
    # docker-entrypoint.sh, which ends in `exec "$@"` — args go straight to the postgres binary.
    #
    # Steady-state result: ~700-800 MB, ~1 GB peak, vs ~2.5 GB unmanaged.
    #
    # RAISE shared_buffers (and effective_cache_size) if the fleet grows past ~50 vehicles or
    # dashboard queries start hitting disk — 512 MB comfortably holds the working set for the
    # live map (vehicle_state is one row per vehicle) plus recent telemetry chunks, but it is
    # sized for a small fleet, not an unbounded one.
    #
    # max_worker_processes must stay >= timescaledb.max_background_workers + max_parallel_workers
    # + a small margin, or TimescaleDB's compression and retention jobs silently fail to start.
    # ─────────────────────────────────────────────────────────────────────────
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=2GB      # planner hint only — allocates nothing
      - -c
      - max_connections=50            # app needs ~20 (pg pool default max 10 x api + ingestion)
      - -c
      - autovacuum_max_workers=3
      - -c
      - timescaledb.max_background_workers=8
      - -c
      - max_worker_processes=13
    ports: !override
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the shell env or a root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — do not ship the dev default}
      POSTGRES_DB: ${POSTGRES_DB:-clarity_fleet}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: always
    ports: !override
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    restart: always
    # !override here too: env_file is list-merged like ports, so without it the base file's
    # dev ./backend/.env would still be loaded alongside this one, leaking dev-only values
    # (localhost WEB_URL, test Stripe keys) for any key .env.production doesn't redefine.
    env_file: !override
      - ./backend/.env.production
    environment: !override
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clarity_fleet}
      REDIS_URL: redis://redis:6379
      TCP_INTERNAL_URL: http://tcp-listener:4001
    ports: !override
      - '127.0.0.1:3000:3000'
    # storage/reports is written AND served by the api process only — reports-queue.ts's
    # REPORTS_DIR resolves to /app/storage/reports, and the only importers are api.ts,
    # fleet/routes/reports-async.ts and admin/routes/reports.ts. ingestion never touches it,
    # so this is a single mount rather than a shared one.
    volumes:
      - report_storage:/app/storage
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tcp-listener:
    restart: always
    # !override here too: env_file is list-merged like ports, so without it the base file's
    # dev ./backend/.env would still be loaded alongside this one, leaking dev-only values
    # (localhost WEB_URL, test Stripe keys) for any key .env.production doesn't redefine.
    env_file: !override
      - ./backend/.env.production
    environment: !override
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    # 5027 PUBLIC (device port, raw TCP — this is what the FTC921 dials).
    # 4001 is the internal command/metrics server: localhost only, reached by api over the
    # compose network as http://tcp-listener:4001, never from outside the box.
    ports: !override
      - '5027:5027'
      - '127.0.0.1:4001:4001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingestion:
    restart: always
    # !override here too: env_file is list-merged like ports, so without it the base file's
    # dev ./backend/.env would still be loaded alongside this one, leaking dev-only values
    # (localhost WEB_URL, test Stripe keys) for any key .env.production doesn't redefine.
    env_file: !override
      - ./backend/.env.production
    environment: !override
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clarity_fleet}
      REDIS_URL: redis://redis:6379
    ports: !override
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  report_storage:
