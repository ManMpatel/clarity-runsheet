name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 209.38.83.138 >> ~/.ssh/known_hosts

      - name: Deploy to clarity-api
        run: |
          ssh -i ~/.ssh/id_rsa root@209.38.83.138 "
            cd ~/clarity/api &&
            git pull origin main &&
            npm install --production &&
            pm2 restart clarity-api
          "

      - name: Wait for API to start
        run: sleep 15

      - name: Health check API
        id: healthcheck
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.clarity-software.com.au/health)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Rollback API if health check failed
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/id_rsa root@209.38.83.138 "
            cd ~/clarity/api &&
            git revert HEAD --no-edit &&
            npm install --production &&
            pm2 restart clarity-api &&
            echo 'ROLLBACK COMPLETE'
          "

  deploy-tcp:
    name: Deploy TCP Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 170.64.148.64 >> ~/.ssh/known_hosts

      - name: Deploy to clarity-tcp
        run: |
          ssh -i ~/.ssh/id_rsa root@170.64.148.64 "
            cd ~/clarity/tcp-listener &&
            git pull origin main &&
            npm install --production &&
            pm2 restart clarity-tcp
          "

      - name: Wait for TCP to start
        run: sleep 10

      - name: Check TCP process is running
        id: tcpcheck
        run: |
          STATUS=$(ssh -i ~/.ssh/id_rsa root@170.64.148.64 "pm2 jlist | python3 -c \"import sys,json; procs=json.load(sys.stdin); p=[x for x in procs if x['name']=='clarity-tcp']; print(p[0]['pm2_env']['status'] if p else 'not found')\"")
          echo "TCP status: $STATUS"
          if [ "$STATUS" != "online" ]; then
            echo "TCP listener is not online"
            exit 1
          fi

      - name: Rollback TCP if check failed
        if: failure() && steps.tcpcheck.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/id_rsa root@170.64.148.64 "
            cd ~/clarity/tcp-listener &&
            git revert HEAD --no-edit &&
            npm install --production &&
            pm2 restart clarity-tcp &&
            echo 'ROLLBACK COMPLETE'
          "

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 134.199.144.238 >> ~/.ssh/known_hosts

      - name: Deploy to clarity-worker
        run: |
          ssh -i ~/.ssh/id_rsa root@134.199.144.238 "
            cd ~/clarity/worker &&
            git pull origin main &&
            npm install --production &&
            pm2 restart clarity-worker
          "

      - name: Wait for worker to start
        run: sleep 10

      - name: Check worker process is running
        id: workercheck
        run: |
          STATUS=$(ssh -i ~/.ssh/id_rsa root@134.199.144.238 "pm2 jlist | python3 -c \"import sys,json; procs=json.load(sys.stdin); p=[x for x in procs if x['name']=='clarity-worker']; print(p[0]['pm2_env']['status'] if p else 'not found')\"")
          echo "Worker status: $STATUS"
          if [ "$STATUS" != "online" ]; then
            echo "Worker is not online"
            exit 1
          fi

      - name: Rollback worker if check failed
        if: failure() && steps.workercheck.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/id_rsa root@134.199.144.238 "
            cd ~/clarity/worker &&
            git revert HEAD --no-edit &&
            npm install --production &&
            pm2 restart clarity-worker &&
            echo 'ROLLBACK COMPLETE'
          "