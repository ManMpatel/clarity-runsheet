name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend (Docker Compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.VPS_HOST }} "
            cd /opt/apps/clarity-fleet &&
            git rev-parse HEAD > /opt/apps/.clarity_prev_sha &&
            git pull origin main &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hostinger.yml up -d --build
          "

      - name: Wait for services to start
        run: sleep 30

      - name: Health check API
        id: healthcheck
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.clarity-software.com.au/health)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Rollback if health check failed
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.VPS_HOST }} "
            cd /opt/apps/clarity-fleet &&
            git reset --hard \$(cat /opt/apps/.clarity_prev_sha) &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hostinger.yml up -d --build
          "
